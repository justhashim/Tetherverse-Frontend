name = "tetherverse-frontend"
main = ".open-next/worker.js"

# Matches the Excel Play launcher's Worker, so both apps on Cloudflare run the
# same runtime and the team has one compatibility date to reason about.
compatibility_date = "2025-12-15"

# OpenNext needs the Node.js compatibility layer for the runtime APIs its
# server-side route handlers rely on.
compatibility_flags = ["nodejs_compat"]

# ── Runtime configuration ───────────────────────────────────────────────────
#
# Where the Tetherverse API lives. The route handlers read it on every request,
# so changing it is an edit to this value - or to the dashboard - and not a
# rebuild of the Next app. That is exactly why it is not a build variable: the
# backend is still moving, and relocating it should not need a frontend deploy
# that recompiles the bundle.
#
# Not a secret: it is a public service address. It does stay server-side, though.
# The route handlers are the only callers and there is no NEXT_PUBLIC_ prefix for
# it, so it never reaches the browser and the API cannot be discovered from the
# client bundle.
#
# A variable rather than a literal in the code: one module reads it
# (src/lib/tetherverse-api.ts), there is no production fallback, and a missing
# address is a 502 with a logged reason instead of a silent call to localhost.
#
# The value below is the Cloud Run deployment in asia-southeast1. To move the
# API, edit this line and redeploy; or edit the same variable in the dashboard,
# which takes effect on the next request with no deploy and no rebuild.
#
# `wrangler secret put TETHERVERSE_API_URL` works too, and keeps the value out of
# this file, at the cost of not being reviewable in a diff.

[vars]
TETHERVERSE_API_URL = "https://tetherverse-backend-46039623481.asia-southeast1.run.app"

# ── Build configuration ─────────────────────────────────────────────────────
#
# The NEXT_PUBLIC_* origins are not here and cannot be: they are inlined into
# the client bundle at build time, so they belong to Workers Builds (dashboard:
# Settings > Build), not to the running Worker. The repo commits neither them
# nor an env.prod, so no deployed origin lives in a public diff. A build without
# them is refused by scripts/build-worker.mjs rather than shipping empty CSP
# frame-ancestors.

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
