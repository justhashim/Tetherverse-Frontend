# This is a single-package repo, but the file has to declare a workspace.
# pnpm 9 (which Cloudflare Workers Builds selects by default) rejects a
# workspace file with no `packages` key: "packages field missing or empty".
# pnpm 12 tolerates the omission locally, which is why this only failed in CI.
packages:
  - "."

allowBuilds:
  # Required by the Cloudflare toolchain, all of it dev-only.
  #
  # workerd is the Workers runtime: `wrangler dev` and `opennextjs-cloudflare
  # preview` cannot start without its binary. esbuild is the bundler inside
  # wrangler and @opennextjs/cloudflare. sharp is pulled in by both wrangler's
  # miniflare and next, and is what a local image optimizer would use.
  esbuild: true
  workerd: true
  sharp: true
  # The napi resolver binary that eslint's import resolver uses.
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20261019.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261019.1'
  - '@cloudflare/workerd-linux-64@1.20261019.1'
  - '@cloudflare/workerd-linux-arm64@1.20261019.1'
  - '@cloudflare/workerd-windows-64@1.20261019.1'
  - miniflare@5.20261019.0-beta
  - workerd@1.20261019.1
  - wrangler@4.151.2
permissions:
  phaser:
    skills: true
